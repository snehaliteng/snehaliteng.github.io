<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Snehal IT Eng</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
    <div class="text-4xl mb-4">&#128274;</div>
    <h1 class="text-2xl font-bold mb-2">Admin Panel</h1>
    <p class="text-gray-500 text-sm mb-6">Sign in with the admin account to continue.</p>
    <div id="alert"></div>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-3 text-sm" required>
      <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 text-sm" required>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Login</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button');
      btn.disabled = true; btn.textContent = 'Checking...';
      try {
        const { data, error } = await _admin.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (data.user.email !== ADMIN_EMAIL) {
          await _admin.auth.signOut();
          document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-2 rounded text-sm mb-4">Access denied. Admin only.</div>';
          btn.disabled = false; btn.textContent = 'Login';
          return;
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-2 rounded text-sm mb-4">' + err.message + '</div>';
      }
      btn.disabled = false; btn.textContent = 'Login';
    });
  </script>
</body>
</html>
