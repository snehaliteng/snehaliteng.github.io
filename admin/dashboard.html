<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
  </style>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg">SnehalITEng</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Admin</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">Dashboard</a>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <a href="users.html" class="bg-white p-6 rounded-xl shadow-sm border hover:shadow-md transition block">
        <div class="text-3xl mb-2">&#128101;</div>
        <div class="text-lg font-semibold">Users</div>
        <div class="text-sm text-gray-500">Manage registered users</div>
      </a>
      <a href="subscribers.html" class="bg-white p-6 rounded-xl shadow-sm border hover:shadow-md transition block">
        <div class="text-3xl mb-2">&#128231;</div>
        <div class="text-lg font-semibold">Subscribers</div>
        <div class="text-sm text-gray-500">Newsletter subscribers</div>
      </a>
      <a href="contacts.html" class="bg-white p-6 rounded-xl shadow-sm border hover:shadow-md transition block">
        <div class="text-3xl mb-2">&#128172;</div>
        <div class="text-lg font-semibold">Contacts</div>
        <div class="text-sm text-gray-500">Contact form submissions</div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      document.getElementById('user-email').textContent = user.email;
    });
  </script>
</body>
</html>
