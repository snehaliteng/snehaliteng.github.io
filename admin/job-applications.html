<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Applications - Admin - Snehal IT Eng</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-shortlisted { background: #dcfce7; color: #166534; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
  </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="../" class="text-blue-600 font-bold text-lg">SnehalITEng</a>
      <span class="text-gray-400">|</span>
      <span class="font-semibold">Admin / Job Applications</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">Dashboard</a>
      <button onclick="signOut()" class="text-sm text-red-500 hover:underline">Logout</button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Job Applications</h1>
      <div class="flex gap-2">
        <select id="filter-status" onchange="loadApplications()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Shortlisted">Shortlisted</option>
          <option value="Rejected">Rejected</option>
        </select>
        <select id="filter-position" onchange="loadApplications()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="all">All Positions</option>
          <option value="Senior Full-Stack Developer">Senior Full-Stack Developer</option>
          <option value="Cloud Solutions Architect">Cloud Solutions Architect</option>
          <option value="AI/ML Engineer">AI/ML Engineer</option>
          <option value="DevOps Engineer">DevOps Engineer</option>
          <option value="Angular Developer">Angular Developer</option>
          <option value="React Developer">React Developer</option>
          <option value=".NET Core Developer">.NET Core Developer</option>
          <option value="General Application">General Application</option>
        </select>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button id="toggle-charts" onclick="toggleCharts()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white hover:bg-gray-50">Show Salary Charts</button>
      <button id="toggle-archive" onclick="toggleArchive()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white hover:bg-gray-50">Local Archive <span id="archive-count" class="text-gray-400">(0)</span></button>
      <select id="page-size" onchange="changePageSize(this.value)" class="border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="10">10 per page</option>
        <option value="25">25 per page</option>
        <option value="50">50 per page</option>
      </select>
    </div>
    <div id="alert"></div>

    <div id="charts-section" class="hidden mb-6">
      <div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex flex-wrap justify-between items-center mb-3 gap-2">
          <h2 class="font-bold text-lg">Salary Insights</h2>
          <span class="text-xs text-gray-400">Avg Expected CTC (LPA) based on current filters</span>
        </div>
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <h3 class="text-sm font-semibold text-gray-600 mb-2">Avg Salary by Experience</h3>
            <div class="relative" id="wrap-chartExperience" style="height:240px">
              <canvas id="chartExperience"></canvas>
              <div id="chartExpEmpty" class="hidden absolute inset-0 flex items-center justify-center text-sm text-gray-400">No salary data to chart.</div>
            </div>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-gray-600 mb-2">Avg Salary by Technology</h3>
            <div class="relative" id="wrap-chartTechnology" style="height:240px">
              <canvas id="chartTechnology"></canvas>
              <div id="chartTechEmpty" class="hidden absolute inset-0 flex items-center justify-center text-sm text-gray-400">No salary data to chart.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="archive-section" class="hidden mb-6">
      <div class="bg-white rounded-xl shadow-sm border">
        <div class="flex justify-between items-center p-4 border-b">
          <h2 class="font-bold text-lg">Local Archive <span class="text-sm font-normal text-gray-400">(on-device SQLite)</span></h2>
          <button onclick="clearArchive()" class="text-red-500 hover:underline text-sm">Clear All</button>
        </div>
        <div id="archive-table" class="overflow-x-auto"></div>
      </div>
    </div>

    <div id="loading" class="text-gray-500">Loading applications...</div>
    <div id="applications-table" class="hidden overflow-x-auto bg-white rounded-xl shadow-sm border"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/job-sqlite.js"></script>
  <script>
    var filteredData = [];
    var currentPage = 1;
    var pageSize = 10;
    var expChart = null, techChart = null;

    document.addEventListener('DOMContentLoaded', async function() {
      const user = await requireAdmin();
      if (!user) return;
      initJobSql().then(function() { renderArchive(); }).catch(function(e) { console.error('SQLite init failed', e); });
      loadApplications();
    });

    function statusBadge(s) {
      if (s === 'Shortlisted') return '<span class="badge badge-shortlisted">Shortlisted</span>';
      if (s === 'Rejected') return '<span class="badge badge-rejected">Rejected</span>';
      return '<span class="badge badge-pending">Pending</span>';
    }

    function parseStatus(service) {
      if (!service) return 'Pending';
      if (service.endsWith(' - Shortlisted')) return 'Shortlisted';
      if (service.endsWith(' - Rejected')) return 'Rejected';
      return 'Pending';
    }

    function parsePosition(service) {
      if (!service) return '-';
      var s = service.replace('Career Application - ', '');
      s = s.replace(' - Shortlisted', '').replace(' - Rejected', '');
      return s;
    }

    function setStatus(service, newStatus) {
      var base = parsePosition(service);
      if (newStatus === 'Pending') return 'Career Application - ' + base;
      return 'Career Application - ' + base + ' - ' + newStatus;
    }

    async function loadApplications() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('loading').textContent = 'Loading applications...';
      document.getElementById('applications-table').classList.add('hidden');

      try {
        var filterStatus = document.getElementById('filter-status').value;
        var filterPosition = document.getElementById('filter-position').value;

        var query = _admin
          .from('contact')
          .select('*')
          .ilike('service', 'Career Application -%')
          .order('created_at', { ascending: false });

        var { data, error } = await query;
        if (error) throw error;

        document.getElementById('loading').classList.add('hidden');

        if (filterPosition !== 'all') {
          data = data.filter(function(r) {
            return parsePosition(r.service) === filterPosition;
          });
        }
        if (filterStatus !== 'all') {
          data = data.filter(function(r) {
            return parseStatus(r.service) === filterStatus;
          });
        }

        filteredData = data;
        currentPage = 1;
        buildCharts(data);
        renderTable();
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    function renderTable() {
      var div = document.getElementById('applications-table');
      div.classList.remove('hidden');

      var total = filteredData.length;
      if (!total) {
        div.innerHTML = '<div class="p-6 text-gray-500 text-center">No applications found.</div>';
        return;
      }

      var pages = Math.max(1, Math.ceil(total / pageSize));
      if (currentPage > pages) currentPage = pages;
      var start = (currentPage - 1) * pageSize;
      var pageData = filteredData.slice(start, start + pageSize);

      var html = `
        <table class="w-full text-sm">
          <thead><tr class="bg-gray-50 border-b text-left">
            <th class="p-3 font-semibold">Name</th>
            <th class="p-3 font-semibold">Email</th>
            <th class="p-3 font-semibold">Phone</th>
            <th class="p-3 font-semibold">Exp</th>
            <th class="p-3 font-semibold">Position</th>
            <th class="p-3 font-semibold">Curr CTC</th>
            <th class="p-3 font-semibold">Exp CTC</th>
            <th class="p-3 font-semibold">Location</th>
            <th class="p-3 font-semibold">Message</th>
            <th class="p-3 font-semibold">Date</th>
            <th class="p-3 font-semibold">Status</th>
            <th class="p-3 font-semibold">Actions</th>
          </tr></thead>
          <tbody>${pageData.map(function(r) {
            var status = parseStatus(r.service);
            var hasCV = r.message && r.message.indexOf('--- CV Data ---') !== -1;
            function msgField(f) { var m = r.message || ''; var re = new RegExp(f + ':\\s*(.+?)(?:\\n|$)'); var x = m.match(re); return x ? x[1].trim() : ''; }
            var expYrs = msgField('Experience');
            var currCtc = msgField('Current CTC');
            var expCtc = msgField('Expected CTC');
            var loc = msgField('Location');
            var msgPreview = r.message ? r.message.replace(/--- CV Data ---[\s\S]*/, '').substring(0, 120) : '';
            if (r.message && r.message.length > 120 && !r.message.match(/--- CV Data ---/)) msgPreview += '...';
            return '<tr class="border-b hover:bg-gray-50">'
              + '<td class="p-3 font-medium">' + escapeHtml(r.name || '-') + '</td>'
              + '<td class="p-3"><a href="mailto:' + escapeHtml(r.email) + '" class="text-blue-600 hover:underline">' + escapeHtml(r.email) + '</a></td>'
              + '<td class="p-3">' + escapeHtml(r.phone || '-') + '</td>'
              + '<td class="p-3 text-xs font-medium">' + escapeHtml(expYrs || '-') + '</td>'
              + '<td class="p-3"><span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">' + escapeHtml(parsePosition(r.service)) + '</span></td>'
              + '<td class="p-3 text-xs font-medium">' + escapeHtml(currCtc || '-') + '</td>'
              + '<td class="p-3 text-xs font-medium">' + escapeHtml(expCtc || '-') + '</td>'
              + '<td class="p-3 text-xs">' + escapeHtml(loc || '-') + '</td>'
              + '<td class="p-3 max-w-xs"><div class="truncate" title="' + escapeHtml(msgPreview) + '">' + escapeHtml(msgPreview) + '</div>'
              + (hasCV ? '<span class="text-green-600 text-xs font-medium">\u2713 CV:</span> <button class="text-blue-600 hover:underline text-xs font-medium download-cv" data-id="' + r.id + '">Download</button>' : '')
              + '<button class="text-blue-600 hover:underline text-xs ml-2" onclick="showMessage(' + r.id + ')">View</button></td>'
              + '<td class="p-3 text-gray-500 text-xs whitespace-nowrap">' + new Date(r.created_at).toLocaleString() + '</td>'
              + '<td class="p-3" id="status-' + r.id + '">' + statusBadge(status) + '</td>'
              + '<td class="p-3"><div class="flex gap-1 flex-wrap" id="actions-' + r.id + '">'
              + (status !== 'Shortlisted' ? '<button class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-medium hover:bg-green-200" onclick="updateStatus(' + r.id + ',\'Shortlisted\')">Shortlist</button>' : '')
              + (status !== 'Rejected' ? '<button class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-medium hover:bg-red-200" onclick="updateStatus(' + r.id + ',\'Rejected\')">Reject</button>' : '')
              + (status !== 'Pending' ? '<button class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-medium hover:bg-yellow-200" onclick="updateStatus(' + r.id + ',\'Pending\')">Reset</button>' : '')
              + '<button class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs font-medium hover:bg-indigo-200" onclick="saveLocal(' + r.id + ')">Save Local</button>'
              + '<button class="text-red-500 hover:underline text-xs ml-1" onclick="deleteApplication(' + r.id + ')">Delete</button>'
              + '</div></td>'
              + '</tr>';
          }).join('')}</tbody>
        </table>
      `;
      html += '<div class="p-3 border-t flex flex-wrap items-center justify-between gap-2">'
        + '<div class="text-xs text-gray-400">Showing ' + (start + 1) + '-' + Math.min(start + pageSize, total) + ' of ' + total + ' application' + (total !== 1 ? 's' : '') + '</div>'
        + '<div class="flex gap-1 flex-wrap items-center">' + renderPagination(pages) + '</div>'
        + '</div>';
      div.innerHTML = html;
    }

    function renderPagination(pages) {
      if (pages <= 1) return '';
      var html = '<button class="page-btn px-2.5 py-1 rounded text-xs font-medium border bg-white text-gray-600 hover:bg-gray-100' + (currentPage <= 1 ? ' opacity-40 cursor-not-allowed' : '') + '" data-page="prev">Prev</button>';
      html += pageNumbers(currentPage, pages).map(function(n) {
        if (n === '...') return '<span class="px-1 text-gray-400">\u2026</span>';
        return '<button class="page-btn px-2.5 py-1 rounded text-xs font-medium border ' + (n === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 hover:bg-gray-100') + '" data-page="' + n + '">' + n + '</button>';
      }).join('');
      html += '<button class="page-btn px-2.5 py-1 rounded text-xs font-medium border bg-white text-gray-600 hover:bg-gray-100' + (currentPage >= pages ? ' opacity-40 cursor-not-allowed' : '') + '" data-page="next">Next</button>';
      return html;
    }

    function pageNumbers(current, total) {
      if (total <= 7) { var a = []; for (var i = 1; i <= total; i++) a.push(i); return a; }
      var set = {};
      [1, total, current - 1, current, current + 1].forEach(function(p) { if (p >= 1 && p <= total) set[p] = true; });
      var keys = Object.keys(set).map(Number).sort(function(a, b) { return a - b; });
      var out = [], prev = 0;
      keys.forEach(function(p) { if (prev && p - prev > 1) out.push('...'); out.push(p); prev = p; });
      return out;
    }

    function changePageSize(v) {
      pageSize = parseInt(v, 10);
      currentPage = 1;
      renderTable();
    }

    function msgFieldOf(msg, field) {
      var re = new RegExp(field + ':\\s*(.+?)(?:\\n|$)');
      var x = msg.match(re);
      return x ? x[1].trim() : '';
    }

    function parseSalaryAnnual(s) {
      if (!s) return null;
      s = s.trim().toLowerCase().replace(/[₹,$]/g, '');
      var m = s.match(/(\d+(?:\.\d+)?)\s*(crore|crores|cr)\b/);
      if (m) return parseFloat(m[1]) * 10000000;
      m = s.match(/(\d+(?:\.\d+)?)\s*(lakhs?|lpa|l)\b/);
      if (m) return parseFloat(m[1]) * 100000;
      m = s.match(/(\d+(?:\.\d+)?)\s*(million|mn|m)\b/);
      if (m) return parseFloat(m[1]) * 1000000;
      m = s.match(/(\d+(?:\.\d+)?)\s*k\b/);
      if (m) return parseFloat(m[1]) * 1000;
      m = s.match(/^(\d+(?:\.\d+)?)$/);
      if (m) return parseFloat(m[1]);
      return null;
    }

    function parseExperienceYears(s) {
      if (!s) return null;
      var t = s.toLowerCase();
      if (t.indexOf('fresher') !== -1) return 0;
      var m = t.match(/(\d+(?:\.\d+)?)\s*(?:-|\u2013|to)\s*(\d+(?:\.\d+)?)/);
      if (m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
      m = t.match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : null;
    }

    function expBucket(y) {
      if (y === null) return null;
      if (y < 1) return '0';
      if (y <= 2) return '1-2';
      if (y <= 5) return '3-5';
      if (y <= 8) return '6-8';
      if (y <= 12) return '9-12';
      return '13+';
    }

    function buildCharts(data) {
      var expAgg = {}, techAgg = {};
      data.forEach(function(r) {
        var msg = r.message || '';
        var ann = parseSalaryAnnual(msgFieldOf(msg, 'Expected CTC'));
        if (ann === null) return;
        var b = expBucket(parseExperienceYears(msgFieldOf(msg, 'Experience')));
        if (b) { expAgg[b] = expAgg[b] || { sum: 0, count: 0 }; expAgg[b].sum += ann; expAgg[b].count++; }
        var t = parsePosition(r.service);
        if (t && t !== '-') { techAgg[t] = techAgg[t] || { sum: 0, count: 0 }; techAgg[t].sum += ann; techAgg[t].count++; }
      });
      expChart = renderChart('chartExperience', 'chartExpEmpty', expChart, ['0', '1-2', '3-5', '6-8', '9-12', '13+'], expAgg, false);
      techChart = renderChart('chartTechnology', 'chartTechEmpty', techChart, null, techAgg, true);
    }

    function renderChart(canvasId, emptyId, prevChart, order, agg, sortByAvg) {
      var canvas = document.getElementById(canvasId);
      var empty = document.getElementById(emptyId);
      if (!canvas) return prevChart;
      if (prevChart) { prevChart.destroy(); prevChart = null; }
      var keys = order ? order.filter(function(k) { return agg[k]; }) : Object.keys(agg);
      if (sortByAvg) keys.sort(function(a, b) { return (agg[b].sum / agg[b].count) - (agg[a].sum / agg[a].count); });
      if (!keys.length) {
        canvas.classList.add('hidden');
        empty.classList.remove('hidden');
        return null;
      }
      canvas.classList.remove('hidden');
      empty.classList.add('hidden');
      var counts = keys.map(function(k) { return agg[k].count; });
      var values = keys.map(function(k) { return parseFloat((agg[k].sum / agg[k].count / 100000).toFixed(1)); });
      return new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: keys,
          datasets: [{
            label: 'Avg Expected CTC (LPA)',
            data: values,
            backgroundColor: '#3b82f6',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(ctx) { return ' Avg: ' + ctx.parsed.y + ' LPA (n=' + counts[ctx.dataIndex] + ')'; }
              }
            }
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: function(v) { return v + ' LPA'; } }, title: { display: true, text: 'LPA' } },
            x: { ticks: { maxRotation: 45, minRotation: 0, font: { size: 10 } } }
          }
        }
      });
    }

    function toggleCharts() {
      var sec = document.getElementById('charts-section');
      sec.classList.toggle('hidden');
      document.getElementById('toggle-charts').textContent = sec.classList.contains('hidden') ? 'Show Salary Charts' : 'Hide Salary Charts';
      if (!sec.classList.contains('hidden')) {
        if (expChart) expChart.resize();
        if (techChart) techChart.resize();
      }
    }

    function toggleArchive() {
      var sec = document.getElementById('archive-section');
      sec.classList.toggle('hidden');
      if (!sec.classList.contains('hidden')) renderArchive();
    }

    function renderArchive() {
      var box = document.getElementById('archive-table');
      var countEl = document.getElementById('archive-count');
      var rows = listLocalArchive();
      if (countEl) countEl.textContent = '(' + rows.length + ')';
      if (!rows.length) {
        box.innerHTML = '<div class="p-6 text-gray-500 text-center text-sm">No locally saved applications yet. Click "Save Local" on any row to download the CV + details and store them in the on-device SQLite database.</div>';
        return;
      }
      var html = '<table class="w-full text-sm"><thead><tr class="bg-gray-50 border-b text-left">'
        + '<th class="p-3 font-semibold">Name</th>'
        + '<th class="p-3 font-semibold">Position</th>'
        + '<th class="p-3 font-semibold">Exp</th>'
        + '<th class="p-3 font-semibold">Exp CTC</th>'
        + '<th class="p-3 font-semibold">Location</th>'
        + '<th class="p-3 font-semibold">Status</th>'
        + '<th class="p-3 font-semibold">Saved</th>'
        + '<th class="p-3 font-semibold">Actions</th></tr></thead><tbody>';
      rows.forEach(function(r) {
        html += '<tr class="border-b hover:bg-gray-50">'
          + '<td class="p-3 font-medium">' + escapeHtml(r.name || '-') + '</td>'
          + '<td class="p-3"><span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">' + escapeHtml(r.position || '-') + '</span></td>'
          + '<td class="p-3 text-xs">' + escapeHtml(r.experience || '-') + '</td>'
          + '<td class="p-3 text-xs font-medium">' + escapeHtml(r.expected_ctc || '-') + '</td>'
          + '<td class="p-3 text-xs">' + escapeHtml(r.location || '-') + '</td>'
          + '<td class="p-3">' + statusBadge(r.status || 'Pending') + '</td>'
          + '<td class="p-3 text-gray-500 text-xs whitespace-nowrap">' + new Date(r.saved_at).toLocaleString() + '</td>'
          + '<td class="p-3"><div class="flex gap-2">'
          + '<button class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium hover:bg-blue-200" onclick="downloadLocalCV(' + r.id + ')">CV</button>'
          + '<button class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-medium hover:bg-red-200" onclick="deleteLocal(' + r.id + ')">Delete</button>'
          + '</div></td></tr>';
      });
      html += '</tbody></table>';
      box.innerHTML = html;
    }

    async function saveLocal(id) {
      try {
        var fileName = await saveApplicationLocal(id);
        renderArchive();
        showAlert('Saved locally: ' + fileName, 'success');
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function deleteLocal(id) {
      if (!confirm('Delete this record from the local archive?')) return;
      try {
        await deleteLocalRecord(id);
        renderArchive();
        showAlert('Deleted from local archive.', 'success');
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function clearArchive() {
      if (!listLocalArchive().length) return;
      if (!confirm('Delete ALL locally saved applications?')) return;
      try {
        await clearLocalArchive();
        renderArchive();
        showAlert('Local archive cleared.', 'success');
      } catch (err) {
        showAlert(err.message, 'error');
      }
    }

    async function updateStatus(id, newStatus) {
      try {
        var { data: rows, error: selErr } = await _admin.from('contact').select('service').eq('id', id).single();
        if (selErr) throw selErr;

        var newService = setStatus(rows.service, newStatus);
        var { error } = await _admin.from('contact').update({ service: newService }).eq('id', id);
        if (error) throw error;

        loadApplications();
      } catch (err) {
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    async function deleteApplication(id) {
      if (!confirm('Delete this application?')) return;
      try {
        var { error } = await _admin.from('contact').delete().eq('id', id);
        if (error) throw error;
        loadApplications();
      } catch (err) {
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.download-cv');
      if (btn) downloadCV(parseInt(btn.dataset.id));
    });

    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.page-btn');
      if (!btn) return;
      var p = btn.dataset.page;
      var pages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      if (p === 'prev') { if (currentPage > 1) { currentPage--; renderTable(); } }
      else if (p === 'next') { if (currentPage < pages) { currentPage++; renderTable(); } }
      else { currentPage = parseInt(p, 10); renderTable(); }
    });

    async function downloadCV(id) {
      try {
        var { data: row, error } = await _admin.from('contact').select('*').eq('id', id).single();
        if (error) throw error;

        var msg = row.message || '';
        var cvDataMatch = msg.match(/--- CV Data ---\n(data:[^,]+;base64,.+)/);
        if (!cvDataMatch) { alert('No CV file data found in this application.'); return; }

        var dataUri = cvDataMatch[1].trim();

        var cvInfoMatch = msg.match(/--- CV ---\n(.+?) \(/);
        var fileName = cvInfoMatch ? cvInfoMatch[1].trim() : 'CV_' + (row.name || 'applicant').replace(/\s+/g, '_') + '.pdf';

        var link = document.createElement('a');
        link.href = dataUri;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        document.getElementById('alert').innerHTML = '<div class="bg-red-100 text-red-700 p-3 rounded text-sm">' + err.message + '</div>';
      }
    }

    function showMessage(id) {
      var find = document.querySelector('#contacts-table');
      // Simple: find the row and open message in alert
      // Better: modal
      var div = document.getElementById('message-modal');
      if (!div) {
        div = document.createElement('div');
        div.id = 'message-modal';
        div.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
        div.onclick = function(e) { if (e.target === div) div.classList.add('hidden'); };
        div.innerHTML = '<div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-screen overflow-y-auto p-6" onclick="event.stopPropagation()">'
          + '<div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Application Details</h2>'
          + '<button onclick="document.getElementById(\'message-modal\').classList.add(\'hidden\')" class="text-gray-500 hover:text-black text-xl">&times;</button></div>'
          + '<div id="message-content" class="text-sm whitespace-pre-wrap"></div></div>';
        document.body.appendChild(div);
      }

      document.getElementById('message-content').textContent = 'Loading...';
      div.classList.remove('hidden');

      _admin.from('contact').select('*').eq('id', id).single().then(function(res) {
        if (res.error) { document.getElementById('message-content').textContent = 'Error: ' + res.error.message; return; }
        var r2 = res.data;
        var msg = r2.message || '';
        function gf(f) { var re = new RegExp(f + ':\\s*(.+?)(?:\\n|$)'); var x = msg.match(re); return x ? x[1].trim() : '-'; }
        var txt = 'Name: ' + (r2.name || '') + '\nEmail: ' + r2.email + '\nPhone: ' + (r2.phone || '') + '\nPosition: ' + parsePosition(r2.service) + '\nExperience: ' + gf('Experience') + '\nStatus: ' + parseStatus(r2.service) + '\nDate: ' + new Date(r2.created_at).toLocaleString() + '\nCurrent CTC: ' + gf('Current CTC') + '\nExpected CTC: ' + gf('Expected CTC') + '\nLocation: ' + gf('Location') + '\n\n--- Cover Letter ---\n' + msg.replace(/--- CV Data ---[\s\S]*/, '').replace(/--- CV ---[\s\S]*/, '');

        var hasCvData = msg.indexOf('--- CV Data ---') !== -1;
        var cvMatch = msg.match(/--- CV ---\n(.+?) \(/);
        if (cvMatch) txt += '\n\n--- CV ---\n' + cvMatch[1].trim();
        if (hasCvData) txt += '\n[Click "Download CV" below to download the file]';

        document.getElementById('message-content').textContent = txt;

        var existingBtn = document.getElementById('modal-download-btn');
        if (existingBtn) existingBtn.remove();
        if (hasCvData) {
          var btn = document.createElement('button');
          btn.id = 'modal-download-btn';
          btn.className = 'mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700';
          btn.textContent = 'Download CV';
          btn.onclick = function() { downloadCV(r2.id); };
          document.getElementById('message-content').parentNode.appendChild(btn);
        }
      });
    }
  </script>
<script src="../js/analytics-tracker.js" defer></script>
