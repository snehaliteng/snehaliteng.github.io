<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Snehal IT Eng Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .pay-methods { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .pay-method { flex: 1; min-width: 160px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: .2s; }
    .pay-method:hover { border-color: #93c5fd; }
    .pay-method.selected { border-color: #2563eb; background: #eff6ff; }
    .pay-method .icon { font-size: 2rem; margin-bottom: 6px; }
    .pay-method .name { font-weight: 600; font-size: .9rem; }
    .pay-section { display: none; margin-top: 16px; }
    .pay-section.active { display: block; }
    .pay-section-inner { background: #f8fafc; border-radius: 12px; padding: 24px; }
    .upi-detail { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .qr-wrap { text-align: center; margin: 16px 0; }
    .qr-wrap img { width: 200px; height: 200px; border-radius: 12px; border: 2px solid #e2e8f0; }
    .open-app-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: .95rem; border: none; cursor: pointer; text-decoration: none; color: #fff; transition: .2s; }
    .open-app-btn.gpay { background: #4285f4; }
    .open-app-btn.gpay:hover { background: #3367d6; }
    .open-app-btn.phonepe { background: #5f259f; }
    .open-app-btn.phonepe:hover { background: #4a1d7a; }
    .open-app-btn.paytm { background: #00baf2; }
    .open-app-btn.paytm:hover { background: #0095c7; }
    .copy-btn { padding: 4px 12px; font-size: .8rem; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; }
    .copy-btn:hover { background: #cbd5e1; }
    .bank-details { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .bank-details dt { font-weight: 600; font-size: .85rem; color: #64748b; margin-top: 8px; }
    .bank-details dt:first-child { margin-top: 0; }
    .bank-details dd { font-size: 1rem; margin-bottom: 8px; }
    .transaction-input { margin-top: 16px; }
    .transaction-input label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 4px; }
    .transaction-input input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .95rem; }
    .upi-apps { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav class="shop-nav">
    <a href="../" class="logo">SnehalITEng</a>
    <div style="display:flex;gap:16px;">
      <a href="../">Home</a>
      <a href="index.html">Shop</a>
      <a href="login.html" id="nav-auth">Login</a>
    </div>
  </nav>

  <div class="container">
    <div id="alert-container"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
      <h1 style="margin:0;">Checkout</h1>
      <span id="user-info" style="font-size:.85rem;color:#64748b;"></span>
    </div>
    <div id="cart-container"><div class="empty-state"><h3>Loading...</h3></div></div>
  </div>

  <footer style="text-align:center;padding:24px;color:#94a3b8;font-size:.85rem;border-top:1px solid #e2e8f0;">
    &copy; 2026 Snehal IT Eng
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await getCurrentUser();
      const navAuth = document.getElementById('nav-auth');
      if (!user) { window.location.href = 'login.html?redirect=cart.html'; return; }
      navAuth.textContent = 'Logout';
      navAuth.href = '#';
      navAuth.addEventListener('click', async (e) => { e.preventDefault(); await signOut(); window.location.reload(); });

      document.getElementById('user-info').textContent = user.email ? 'Logged in as: ' + user.email : '';

      function buildUpiDeepLink(app, total) {
        const pa = 'snehaliteng@okaxis';
        const pn = 'Snehal Kadiya';
        const tn = 'Tutorial E-Books';
        const am = total.toFixed(2);
        const packages = { gpay: 'com.google.android.apps.nbu.paisa.user', phonepe: 'com.phonepe.app', paytm: 'net.one97.paytm' };
        return `intent://pay?pa=${pa}&pn=${encodeURIComponent(pn)}&tn=${encodeURIComponent(tn)}&am=${am}&cu=INR#Intent;scheme=upi;package=${packages[app]};end`;
      }

      async function loadCart() {
        try {
          cartData = await getCart(user.id);
          const container = document.getElementById('cart-container');
          if (!cartData.length) {
            container.innerHTML = '<div class="empty-state"><h3>Your cart is empty</h3><p><a href="index.html" style="color:#2563eb;">Browse tutorials</a></p></div>';
            return;
          }
          totalAmount = getCartTotal(cartData);
          renderCheckout(container);
        } catch (err) {
          document.getElementById('cart-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
      }

      function renderCheckout(container) {
        container.innerHTML = `
          <div class="cart-items">${cartData.map(item => `
            <div class="cart-item">
              <div>
                <strong>${escapeHtml(item.shop_products?.title || 'Unknown')}</strong>
                <div style="font-size:.85rem;color:#64748b;">${formatPrice(item.shop_products?.price || 0)}</div>
              </div>
              <button class="btn btn-danger btn-sm remove-btn" data-cart-id="${item.id}">Remove</button>
            </div>
          `).join('')}</div>
          <div class="cart-summary">
            <div class="total"><span>Total</span><span>${formatPrice(totalAmount)}</span></div>

            <h3 style="margin-top:20px;margin-bottom:8px;">Select Payment Method</h3>
            <div class="pay-methods">
              <div class="pay-method" data-method="gpay">
                <div class="icon">G</div>
                <div class="name">Google Pay</div>
              </div>
              <div class="pay-method" data-method="phonepe">
                <div class="icon">P</div>
                <div class="name">PhonePe</div>
              </div>
              <div class="pay-method" data-method="paytm">
                <div class="icon">P</div>
                <div class="name">Paytm</div>
              </div>
              <div class="pay-method" data-method="razorpay">
                <div class="icon">&#11088;</div>
                <div class="name">Razorpay (Cards / UPI / Wallet)</div>
              </div>
              <div class="pay-method" data-method="netbanking">
                <div class="icon">&#127974;</div>
                <div class="name">Net Banking / NEFT / IMPS</div>
              </div>
            </div>

            <div class="pay-section" id="section-gpay">
              <div class="pay-section-inner">
                <h4 style="margin-bottom:12px;">Pay with Google Pay</h4>
                <div class="qr-wrap">
                  <img src="gpay.jpg" alt="GPay QR Code">
                  <p style="font-size:.85rem;color:#64748b;margin-top:4px;">Scan with GPay app</p>
                </div>
                <div class="upi-detail">
                  <span><strong>UPI ID:</strong> snehaliteng@okaxis</span>
                  <button class="copy-btn" onclick="navigator.clipboard.writeText('snehaliteng@okaxis');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',2000);">Copy</button>
                </div>
                <a class="open-app-btn gpay" href="${buildUpiDeepLink('gpay', totalAmount)}" target="_blank">&#128274; Open in Google Pay</a>
                <div class="transaction-input">
                  <label>UPI Transaction ID / UTR</label>
                  <input type="text" class="tx-input" data-method="gpay" placeholder="Enter UPI transaction ID after payment">
                </div>
              </div>
            </div>

            <div class="pay-section" id="section-phonepe">
              <div class="pay-section-inner">
                <h4 style="margin-bottom:12px;">Pay with PhonePe</h4>
                <div class="qr-wrap">
                  <img src="gpay.jpg" alt="PhonePe QR Code">
                  <p style="font-size:.85rem;color:#64748b;margin-top:4px;">Scan with PhonePe app</p>
                </div>
                <div class="upi-detail">
                  <span><strong>UPI ID:</strong> snehaliteng@okaxis</span>
                  <button class="copy-btn" onclick="navigator.clipboard.writeText('snehaliteng@okaxis');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',2000);">Copy</button>
                </div>
                <a class="open-app-btn phonepe" href="${buildUpiDeepLink('phonepe', Math.round(totalAmount * 100))}" target="_blank">&#128274; Open in PhonePe</a>
                <div class="transaction-input">
                  <label>UPI Transaction ID / UTR</label>
                  <input type="text" class="tx-input" data-method="phonepe" placeholder="Enter UPI transaction ID after payment">
                </div>
              </div>
            </div>

            <div class="pay-section" id="section-paytm">
              <div class="pay-section-inner">
                <h4 style="margin-bottom:12px;">Pay with Paytm</h4>
                <div class="qr-wrap">
                  <img src="gpay.jpg" alt="Paytm QR Code">
                  <p style="font-size:.85rem;color:#64748b;margin-top:4px;">Scan with Paytm app</p>
                </div>
                <div class="upi-detail">
                  <span><strong>UPI ID:</strong> snehaliteng@okaxis</span>
                  <button class="copy-btn" onclick="navigator.clipboard.writeText('snehaliteng@okaxis');this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',2000);">Copy</button>
                </div>
                <a class="open-app-btn paytm" href="${buildUpiDeepLink('paytm', Math.round(totalAmount * 100))}" target="_blank">&#128274; Open in Paytm</a>
                <div class="transaction-input">
                  <label>UPI Transaction ID / UTR</label>
                  <input type="text" class="tx-input" data-method="paytm" placeholder="Enter UPI transaction ID after payment">
                </div>
              </div>
            </div>

            <div class="pay-section" id="section-razorpay">
              <div class="pay-section-inner">
                <h4 style="margin-bottom:12px;">Pay with Razorpay</h4>
                <p style="font-size:.9rem;color:#64748b;">Pay via Credit/Debit Card, UPI, Net Banking, or Wallet.</p>
                <div id="razorpay-button-area" style="margin-top:16px;">
                  <button id="razorpay-pay-btn" class="btn btn-primary" style="width:100%;">Pay &#8377;<span id="razorpay-amount">${totalAmount.toFixed(2)}</span> via Razorpay</button>
                </div>
                <div id="razorpay-status" style="margin-top:12px;"></div>
              </div>
            </div>

            <div class="pay-section" id="section-netbanking">
              <div class="pay-section-inner">
                <h4 style="margin-bottom:12px;">Pay via Net Banking / NEFT / IMPS</h4>
                <p style="font-size:.9rem;color:#64748b;">Transfer the total amount to the following account:</p>
                <dl class="bank-details">
                  <dt>Account Holder</dt>
                  <dd>Snehal Kadiya</dd>
                  <dt>Bank</dt>
                  <dd>State Bank of India (SBI)</dd>
                  <dt>Account Number</dt>
                  <dd><strong id="bank-account">[Your Account Number]</strong></dd>
                  <dt>IFSC Code</dt>
                  <dd><strong id="bank-ifsc">[Your IFSC Code]</strong></dd>
                  <dt>Amount</dt>
                  <dd><strong>${formatPrice(totalAmount)}</strong></dd>
                </dl>
                <div class="transaction-input">
                  <label>Transaction Reference Number</label>
                  <input type="text" class="tx-input" data-method="netbanking" placeholder="Enter NEFT/IMPS reference or UTR">
                </div>
              </div>
            </div>

            <button id="place-order-btn" class="btn btn-primary" style="width:100%;margin-top:16px;" disabled>Select a payment method</button>
          </div>
        `;

        wireEvents();
      }

      let selectedMethod = null;

      function wireEvents() {
        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            await removeFromCart(parseInt(this.dataset.cartId));
            await loadCart();
          });
        });

        document.querySelectorAll('.pay-method').forEach(el => {
          el.addEventListener('click', function() {
            document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
            this.classList.add('selected');
            selectedMethod = this.dataset.method;
            document.querySelectorAll('.pay-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + selectedMethod).classList.add('active');
            document.getElementById('place-order-btn').disabled = false;
            document.getElementById('place-order-btn').textContent = 'Submit & Place Order';
          });
        });

        async function startRazorpayFlow() {
          document.getElementById('razorpay-status').innerHTML = '<div style="color:#2563eb;">Creating order...</div>';
          try {
            const rzpOrder = await createRazorpayOrder();
            const options = {
              key: rzpOrder.key_id,
              amount: rzpOrder.amount,
              currency: rzpOrder.currency || 'INR',
              name: 'Snehal IT Eng',
              description: 'Tutorial E-Books',
              order_id: rzpOrder.id,
              prefill: { name: rzpOrder.user_name, email: rzpOrder.user_email, contact: '919974031480' },
              theme: { color: '#2563eb' },
              handler: async function(response) {
                document.getElementById('razorpay-status').innerHTML = '<div style="color:#2563eb;">Verifying payment...</div>';
                try {
                  const verified = await verifyRazorpayPayment({
                    razorpay_order_id: response.razorpay_order_id,
                    razorpay_payment_id: response.razorpay_payment_id,
                    razorpay_signature: response.razorpay_signature
                  });
                  localStorage.setItem('last_order', JSON.stringify({
                    items: verified.items || [],
                    total: totalAmount,
                    transaction_id: response.razorpay_payment_id,
                    payment_method: 'razorpay',
                    order_id: verified.order_id,
                    email_sent: verified.email_sent
                  }));
                  window.location.href = 'success.html';
                } catch (err) {
                  document.getElementById('razorpay-status').innerHTML = '<div class="alert alert-error">Verification failed: ' + err.message + '</div>';
                }
              },
              modal: { ondismiss: function() {
                document.getElementById('razorpay-status').innerHTML = '<div style="color:#64748b;">Payment cancelled.</div>';
              }}
            };
            const rzp = new Razorpay(options);
            rzp.open();
          } catch (err) {
            document.getElementById('razorpay-status').innerHTML = '<div class="alert alert-error">' + err.message + '</div>';
          }
        }

        document.getElementById('razorpay-pay-btn').addEventListener('click', startRazorpayFlow);

        document.getElementById('place-order-btn').addEventListener('click', async function() {
          if (!selectedMethod) return;

          if (selectedMethod === 'razorpay') { startRazorpayFlow(); return; }

          const txInput = document.querySelector('.tx-input[data-method="' + selectedMethod + '"]');
          const txId = txInput ? txInput.value.trim() : '';
          if (!txId) {
            document.getElementById('alert-container').innerHTML = '<div class="alert alert-error">Please enter the transaction ID after making payment.</div>';
            return;
          }
          this.disabled = true;
          this.textContent = 'Placing order...';
          try {
            const result = await createOrder(selectedMethod === 'gpay' || selectedMethod === 'phonepe' || selectedMethod === 'paytm' ? 'upi' : selectedMethod, txId);
            localStorage.setItem('last_order', JSON.stringify({
              items: cartData.map(c => ({ title: c.shop_products?.title, price: c.shop_products?.price, pdf_url: c.shop_products?.pdf_url })),
              total: totalAmount, transaction_id: txId, payment_method: selectedMethod,
              order_id: result.order_id, email_sent: result.email_sent
            }));
            window.location.href = 'success.html';
          } catch (err) {
            document.getElementById('alert-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
          }
          this.disabled = false;
          this.textContent = 'Submit & Place Order';
        });
      }

      await loadCart();
    });
  </script>
</body>
</html>
