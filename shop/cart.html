<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Snehal IT Eng Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .payment-methods { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
    .payment-method { flex: 1; min-width: 180px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: .2s; }
    .payment-method:hover { border-color: #93c5fd; }
    .payment-method.selected { border-color: #2563eb; background: #eff6ff; }
    .payment-method .icon { font-size: 2rem; margin-bottom: 8px; }
    .payment-method .name { font-weight: 600; font-size: .95rem; }
    .payment-instructions { background: #f8fafc; border-radius: 12px; padding: 24px; margin: 16px 0; display: none; }
    .payment-instructions.active { display: block; }
    .upi-qr-placeholder { width: 200px; height: 200px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: .85rem; color: #94a3b8; margin: 16px auto; }
    .transaction-input { margin-top: 16px; }
    .copy-btn { padding: 4px 12px; font-size: .8rem; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; margin-left: 8px; }
    .copy-btn:hover { background: #cbd5e1; }
    .bank-details { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .bank-details dt { font-weight: 600; font-size: .85rem; color: #64748b; }
    .bank-details dd { font-size: 1rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav class="shop-nav">
    <a href="../" class="logo">SnehalITEng</a>
    <div style="display:flex;gap:16px;">
      <a href="../">Home</a>
      <a href="index.html">Shop</a>
      <a href="login.html" id="nav-auth">Login</a>
    </div>
  </nav>

  <div class="container">
    <div id="alert-container"></div>
    <h1>Checkout</h1>
    <div id="cart-container"><div class="empty-state"><h3>Loading...</h3></div></div>
  </div>

  <footer style="text-align:center;padding:24px;color:#94a3b8;font-size:.85rem;border-top:1px solid #e2e8f0;">
    &copy; 2026 Snehal IT Eng
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const user = await getCurrentUser();
      const navAuth = document.getElementById('nav-auth');
      if (!user) { window.location.href = 'login.html?redirect=shop/cart.html'; return; }
      navAuth.textContent = 'Logout';
      navAuth.href = '#';
      navAuth.addEventListener('click', async (e) => { e.preventDefault(); await signOut(); window.location.reload(); });

      let selectedMethod = null;
      let cartData = [];

      async function loadCart() {
        try {
          cartData = await getCart(user.id);
          const container = document.getElementById('cart-container');
          if (!cartData.length) {
            container.innerHTML = '<div class="empty-state"><h3>Your cart is empty</h3><p><a href="index.html" style="color:#2563eb;">Browse tutorials</a></p></div>';
            return;
          }
          const total = getCartTotal(cartData);
          container.innerHTML = `
            <div class="cart-items">${cartData.map(item => `
              <div class="cart-item">
                <div>
                  <strong>${escapeHtml(item.shop_products?.title || 'Unknown')}</strong>
                  <div style="font-size:.85rem;color:#64748b;">${formatPrice(item.shop_products?.price || 0)}</div>
                </div>
                <button class="btn btn-danger btn-sm remove-btn" data-cart-id="${item.id}">Remove</button>
              </div>
            `).join('')}</div>
            <div class="cart-summary">
              <div class="total"><span>Total</span><span>${formatPrice(total)}</span></div>

              <h3 style="margin-top:20px;margin-bottom:8px;">Select Payment Method</h3>
              <div class="payment-methods">
                <div class="payment-method" data-method="upi">
                  <div class="icon">&#128179;</div>
                  <div class="name">UPI (GPay / PhonePe / Paytm)</div>
                </div>
                <div class="payment-method" data-method="netbanking">
                  <div class="icon">&#127974;</div>
                  <div class="name">Net Banking / NEFT / IMPS</div>
                </div>
              </div>

              <div class="payment-instructions" id="upi-instructions">
                <h4 style="margin-bottom:12px;">Pay via UPI</h4>
                <p>Open any UPI app (GPay, PhonePe, Paytm) and scan or pay to:</p>
                <div style="margin:16px 0;padding:12px;background:#fff;border-radius:8px;border:1px solid #e2e8f0;">
                  <strong>UPI ID:</strong> <span id="upi-id">${UPI_ID}</span>
                  <button class="copy-btn" onclick="navigator.clipboard.writeText('${UPI_ID}').then(() => this.textContent='Copied!').catch(() => {}); setTimeout(() => this.textContent='Copy', 2000);">Copy</button>
                </div>
                <div style="padding:12px;background:#fff;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px;">
                  <strong>Phone Number:</strong> ${UPI_PHONE}
                </div>
                <div class="upi-qr-placeholder">QR Code<br><span style="font-size:.75rem;">(Generate via any UPI app)</span></div>
                <p style="font-size:.9rem;color:#64748b;">After payment, enter the UPI transaction ID (UTR) below:</p>
                <div class="transaction-input">
                  <label style="font-weight:600;font-size:.9rem;display:block;margin-bottom:4px;">UPI Transaction ID / UTR</label>
                  <input type="text" id="upi-transaction-id" placeholder="e.g. 123456789012" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.95rem;">
                </div>
              </div>

              <div class="payment-instructions" id="netbanking-instructions">
                <h4 style="margin-bottom:12px;">Pay via Net Banking / NEFT / IMPS</h4>
                <p>Transfer the total amount to the following account:</p>
                <dl class="bank-details">
                  <dt>Account Holder</dt>
                  <dd>Snehal Kadiya</dd>
                  <dt>Bank Name</dt>
                  <dd>State Bank of India (SBI)</dd>
                  <dt>Account Number</dt>
                  <dd><strong id="bank-account">[Your Account Number]</strong></dd>
                  <dt>IFSC Code</dt>
                  <dd><strong id="bank-ifsc">[Your IFSC Code]</strong></dd>
                  <dt>Amount</dt>
                  <dd><strong>${formatPrice(total)}</strong></dd>
                </dl>
                <p style="font-size:.9rem;color:#64748b;">After transfer, enter the transaction reference number below:</p>
                <div class="transaction-input">
                  <label style="font-weight:600;font-size:.9rem;display:block;margin-bottom:4px;">Transaction Reference Number</label>
                  <input type="text" id="netbanking-transaction-id" placeholder="e.g. NEFT reference or UTR" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:.95rem;">
                </div>
              </div>

              <button id="place-order-btn" class="btn btn-primary" style="width:100%;margin-top:16px;" disabled>Select a payment method</button>
            </div>
          `;

          wireCartEvents(total);
        } catch (err) {
          document.getElementById('cart-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        }
      }

      function wireCartEvents(total) {
        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            await removeFromCart(parseInt(this.dataset.cartId));
            await loadCart();
          });
        });

        document.querySelectorAll('.payment-method').forEach(el => {
          el.addEventListener('click', function() {
            document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
            this.classList.add('selected');
            selectedMethod = this.dataset.method;
            document.querySelectorAll('.payment-instructions').forEach(i => i.classList.remove('active'));
            document.getElementById(selectedMethod + '-instructions').classList.add('active');
            document.getElementById('place-order-btn').disabled = false;
            document.getElementById('place-order-btn').textContent = 'Place Order (Pending Payment)';
          });
        });

        const placeBtn = document.getElementById('place-order-btn');
        placeBtn.addEventListener('click', async function() {
          if (!selectedMethod) return;
          const txId = document.getElementById(selectedMethod + '-transaction-id').value.trim();
          if (!txId) {
            document.getElementById('alert-container').innerHTML = '<div class="alert alert-error">Please enter the transaction ID after making payment.</div>';
            return;
          }
          this.disabled = true;
          this.textContent = 'Placing order...';
          try {
            const result = await createOrder(selectedMethod, txId);
            localStorage.setItem('last_order', JSON.stringify({
              items: cartData.map(c => ({ title: c.shop_products?.title, price: c.shop_products?.price })),
              total: total,
              transaction_id: txId,
              payment_method: selectedMethod
            }));
            window.location.href = 'success.html';
          } catch (err) {
            document.getElementById('alert-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
          }
          this.disabled = false;
          this.textContent = 'Place Order (Pending Payment)';
        });
      }

      await loadCart();
    });
  </script>
</body>
</html>
