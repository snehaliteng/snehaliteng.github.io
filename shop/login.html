    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <hr style="flex:1;border:none;border-top:1px solid #e2e8f0;">
      <span style="color:#94a3b8;font-size:.85rem;">or login with email</span>
      <hr style="flex:1;border:none;border-top:1px solid #e2e8f0;">
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
    <p class="text-center mt-4" style="font-size:.9rem;color:#64748b;">
      Don't have an account? <a href="signup.html" style="color:#2563eb;">Sign Up</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/shop.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button');
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        await signIn(email, password);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || 'index.html';
      } catch (err) {
        document.getElementById('alert-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
      btn.disabled = false; btn.textContent = 'Login';
    });
  </script>
