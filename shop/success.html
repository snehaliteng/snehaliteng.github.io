<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Snehal IT Eng</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .dl-list { list-style: none; margin: 16px 0; }
    .dl-list li { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .dl-list li a { color: #2563eb; font-weight: 600; text-decoration: none; }
    .dl-list li a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="shop-nav">
    <a href="../" class="logo">SnehalITEng</a>
    <div style="display:flex;gap:16px;">
      <a href="../">Home</a>
      <a href="index.html">Shop</a>
    </div>
  </nav>

  <div class="container text-center" style="padding-top:60px;">
    <div class="success-icon">&#9989;</div>
    <h1>Payment Confirmed!</h1>
    <p style="color:#64748b;font-size:1.1rem;margin:8px 0 24px;">Thank you for your purchase. Your e-books are ready.</p>

    <div id="order-summary" style="max-width:560px;margin:0 auto 28px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:24px;"></div>

    <div id="email-status" style="max-width:560px;margin:0 auto 28px;border-radius:12px;padding:20px;display:none;"></div>

    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary">Continue Shopping</a>
      <a href="../tutorials/" class="btn btn-secondary">Browse Tutorials</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const data = JSON.parse(localStorage.getItem('last_order') || '{}');
      const summary = document.getElementById('order-summary');
      const emailStatus = document.getElementById('email-status');

      if (!data.items || !data.items.length) {
        summary.innerHTML = '<p style="color:#64748b;">No recent order found.</p>';
        emailStatus.style.display = 'none';
        return;
      }

      summary.innerHTML = `
        <strong style="font-size:1.1rem;">Order Summary</strong>
        <div style="margin-top:12px;">${data.items.map(item => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;">
            <span>${item.title}</span>
            <span style="font-weight:600;">&#8377;${Number(item.price).toFixed(2)}</span>
          </div>
        `).join('')}</div>
        <div style="display:flex;justify-content:space-between;padding:12px 0 0;font-weight:700;font-size:1.1rem;">
          <span>Total</span><span>&#8377;${Number(data.total).toFixed(2)}</span>
        </div>
        <div style="margin-top:12px;font-size:.85rem;color:#64748b;">
          ${data.order_id ? 'Order ID: <strong>' + data.order_id + '</strong><br>' : ''}
          ${data.transaction_id ? 'Transaction ID: <strong>' + data.transaction_id + '</strong>' : ''}
        </div>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;">
          <strong style="font-size:1rem;">Download Your E-Books</strong>
          <ul class="dl-list">${data.items.filter(item => item.pdf_url).map(item => `
            <li>
              <span>${item.title}</span>
              <a href="${item.pdf_url}" target="_blank" download>&#128229; Download PDF</a>
            </li>
          `).join('')}</ul>
        </div>
      `;

      if (data.email_sent) {
        emailStatus.style.display = 'block';
        emailStatus.className = 'alert alert-success';
        emailStatus.innerHTML = '&#9989; Download links have been sent to your email.';
      } else {
        emailStatus.style.display = 'block';
        emailStatus.className = 'alert alert-info';
        emailStatus.innerHTML = '&#128231; Download links can also be accessed above. If you did not receive an email, check your spam folder or <a href="mailto:snehal@snehaliteng.com" style="color:#2563eb;">contact us</a>.';
      }
    });
  </script>
</body>
</html>
