<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Snehal IT Eng Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9334539225953790" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1RVMWL4SDK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-1RVMWL4SDK');</script>
</head>
<body>
  <nav class="blog-nav">
    <div class="container">
      <a href="../" class="logo">SnehalITEng</a>
      <div class="nav-links">
        <a href="../">Home</a>
        <a href="index.html">Blog</a>
        <a href="login.html" class="btn">Login</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Welcome Back</h1>
      <p>Log in to write articles, ask questions, and join the discussion.</p>
    </div>
  </section>

  <main class="container">
    <div class="auth-form">
      <div class="card">
        <div id="alert-container"></div>
        <h2>Log In</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
        </form>
        <div class="form-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Redirect if already logged in
      getCurrentUser().then(user => {
        if (user) window.location.href = 'index.html';
      });

      document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
          await signIn(email, password);
          window.location.href = 'index.html';
        } catch (err) {
          showAlert('alert-container', 'Login failed: ' + err.message, 'error');
        }
        btn.disabled = false;
        btn.textContent = 'Log In';
      });
    });
  </script>
<script src="/js/analytics-tracker.js" defer></script>
</body>
</html>
