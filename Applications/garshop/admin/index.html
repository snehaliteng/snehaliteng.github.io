<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarShop Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/>
            <path d="M3 12h18v5h-2.5M3 12v5h2.5"/>
            <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
          </svg>
        </span>
        <h1>GarShop <span>Admin</span></h1>
        <p>Multi-tenant garage platform</p>
      </div>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- App Screen -->
  <div class="app" id="appScreen" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/>
            <path d="M3 12h18v5h-2.5M3 12v5h2.5"/>
            <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
          </svg>
        </span>
        <span>GarShop <small>Admin</small></span>
      </div>
      <nav class="side-nav">
        <a href="#" data-view="dashboard" class="active">Dashboard</a>
        <a href="#" data-view="garages">Garages</a>
        <a href="#" data-view="users">Users</a>
        <a href="#" data-view="appointments">Appointments</a>
        <a href="#" data-view="issues">Car Issues</a>
        <a href="#" data-view="reminders">Reminders</a>
      </nav>
      <div class="sidebar-footer">
        <span id="adminEmail"></span>
        <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Dashboard</h1>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
      </header>

      <!-- Dashboard -->
      <section id="view-dashboard" class="view">
        <div class="stat-grid" id="statGrid"></div>
        <div class="panel">
          <div class="panel-head">
            <h3>Recent Appointments</h3>
            <a href="#" class="go-view" data-view="appointments">View all →</a>
          </div>
          <div class="table-wrap"><table class="table" id="recentAppointments"></table></div>
        </div>
      </section>

      <!-- Garages -->
      <section id="view-garages" class="view" hidden>
        <div class="panel">
          <div class="panel-head"><h3>All Garages</h3></div>
          <div class="table-wrap"><table class="table" id="garagesTable"></table></div>
        </div>
      </section>

      <!-- Users -->
      <section id="view-users" class="view" hidden>
        <div class="panel">
          <div class="panel-head"><h3>All Users</h3></div>
          <div class="table-wrap"><table class="table" id="usersTable"></table></div>
        </div>
      </section>

      <!-- Appointments -->
      <section id="view-appointments" class="view" hidden>
        <div class="panel">
          <div class="panel-head"><h3>All Appointments</h3></div>
          <div class="table-wrap"><table class="table" id="appointmentsTable"></table></div>
        </div>
      </section>

      <!-- Issues -->
      <section id="view-issues" class="view" hidden>
        <div class="panel">
          <div class="panel-head"><h3>Car Issues &amp; Repair Status</h3></div>
          <div class="table-wrap"><table class="table" id="issuesTable"></table></div>
        </div>
      </section>

      <!-- Reminders -->
      <section id="view-reminders" class="view" hidden>
        <div class="panel">
          <div class="panel-head"><h3>Service Reminders</h3></div>
          <div class="table-wrap"><table class="table" id="remindersTable"></table></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
